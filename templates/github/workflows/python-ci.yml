name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 'latest'

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Run build-ci
        run: task build-ci

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        if: success()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
